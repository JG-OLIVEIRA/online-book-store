spring.application.name=onlinebookstore

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:onlinebookstore}}
spring.datasource.username=${MYSQL_USER:bookstore}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
